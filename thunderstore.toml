[config]
schemaVersion = "0.0.1"

[package]
namespace = "MiniPrince123"
name = "Better_Minimap"
description = "Adds a few QoL features to the minimap."
websiteUrl = "https://github.com/MiniPrince123/Better_Minimap"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
outdir = "build"
icon = "icon.png"
readme = "README.md"

[[build.copy]]
source = "bin/Release/netstandard2.1/Better_Minimap.dll"
target = "BepInEx/plugins/Better_Minimap.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk", ]

[publish.categories]
mycopunk = [ "cosmetic", "client", "qol", "mods"]
